<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pasaje Montes | Alojamiento en Cruz del Eje</title>
    <script>
      // Single Page App redirect for GitHub Pages custom domain
      var l = window.location;
      var redirectPath = l.pathname.slice(1);
      if (redirectPath) {
        window.location.replace(
          l.protocol + '//' + l.host + '/?' + redirectPath + (l.search ? '&' + l.search.slice(1) : '') + l.hash
        );
      } else {
        window.location.replace(l.protocol + '//' + l.host + '/');
      }
    </script>
  </head>
  <body style="font-family: sans-serif; background: #FBF8F3; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0;">
    <p style="color: #4D7080; font-weight: bold;">Cargando Pasaje Montes...</p>
  </body>
</html>
